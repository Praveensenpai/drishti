[package]
name = "drishti"
version = "0.2.6"
edition = "2024"
description = "A TUI browser/downloader for 1TamilMV: WEB-DL only, original-language aware"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "gzip",
    "brotli",
    "deflate",
    "charset",
    "h2",
    "stream",
    "json",
] }
scraper = "0.29"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
dirs = "7"
url = "2.5"
percent-encoding = "2.3"
regex = "1.13"
once_cell = "1.21"
unicode-width = "0.2"
chrono = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
