name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/drishti dist/drishti-linux-x86_64
          chmod +x dist/drishti-linux-x86_64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/drishti-linux-x86_64
          generate_release_notes: true